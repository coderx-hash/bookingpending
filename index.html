<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Pending</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      /* Include any necessary styles to keep consistency */
      #introScreen {
        display: none;
      }
      .hidden {
        display: none;
      }
    </style>
</head>
<body>
    <div id="introScreen">
        <h1>Booking Pending</h1>
        <p>Created by Gelo Cutler</p>
        <button id="enterButton">Enter System</button>
    </div>

    <div id="mainContent" class="hidden">
        <h2>New Transaction</h2>
        <form id="transactionForm">
            <label for="glApprovedDate">GL Approved Date:</label>
            <input type="date" id="glApprovedDate" name="glApprovedDate" required>
            <input type="submit" value="Submit">
        </form>
        
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>GL Start</th>
                </tr>
            </thead>
            <tbody id="pendingStockSummary">
                <!-- Rows will be populated dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const introScreen = document.getElementById('introScreen');
            const mainContent = document.getElementById('mainContent');
            const enterButton = document.getElementById('enterButton');

            // Check local storage to see if user has entered the system before
            if (localStorage.getItem('enteredSystem')) {
                introScreen.classList.add('hidden');
                mainContent.classList.remove('hidden');
            } else {
                introScreen.style.display = 'block';
            }

            enterButton.addEventListener('click', function() {
                localStorage.setItem('enteredSystem', 'true');
                introScreen.classList.add('hidden');
                mainContent.classList.remove('hidden');
            });

            document.getElementById('transactionForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const entry = {
                    glApprovedDate: document.getElementById('glApprovedDate').value,
                    glStartDate: new Date().toISOString() // Capture the current date/time
                };
                // Add new entry to the stock summary table
                const row = document.createElement('tr');
                row.innerHTML = `<td>New Item</td><td>${entry.glStartDate}</td>`;
                document.getElementById('pendingStockSummary').appendChild(row);
                this.reset(); // Reset form fields after submission
            });
        });
    </script>
</body>
</html>
