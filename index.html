<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Medicine Tracker</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --pending-bg: #fff3cd;
            --pending-text: #856404;
            --complete-bg: #d4edda;
            --complete-text: #155724;
            --danger: #e74c3c;
            --light-bg: #f4f7f6;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background-color: var(--light-bg); color: #333; padding: 20px; }

        .container { max-width: 1400px; margin: 0 auto; }

        /* HEADER & STATS */
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: var(--card-shadow); text-align: center;
            border-bottom: 4px solid var(--accent);
        }
        .stat-val { font-size: 2rem; font-weight: bold; display: block; }
        .stat-lbl { font-size: 0.8rem; text-transform: uppercase; color: #777; letter-spacing: 1px; }
        
        /* FORM SECTION */
        .form-section {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: var(--card-shadow); margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--secondary); }
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 4px; outline: none; transition: 0.3s;
        }
        .form-group input:focus { border-color: var(--accent); }
        
        button.btn-add {
            background: var(--primary); color: white; border: none;
            padding: 11px 20px; border-radius: 4px; cursor: pointer;
            font-weight: 600; text-transform: uppercase; width: 100%;
        }
        button.btn-add:hover { background: var(--secondary); }

        /* MAIN CONTENT - SPLIT VIEW */
        .lists-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 50% - 50% Split */
            gap: 20px;
            height: calc(100vh - 350px); /* Fill remaining height */
            min-height: 500px;
        }

        .list-column {
            background: white; border-radius: 8px;
            box-shadow: var(--card-shadow);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .col-header {
            padding: 15px; text-align: center; font-weight: bold;
            color: white; letter-spacing: 1px;
        }
        .header-pending { background: #e67e22; }
        .header-complete { background: #27ae60; }

        .col-content {
            padding: 15px;
            overflow-y: auto; /* Scrollable inside */
            flex: 1;
            background: #fafafa;
        }

        /* PROCESSOR GROUPS */
        .processor-group {
            background: white; border: 1px solid #e0e0e0;
            border-radius: 6px; margin-bottom: 15px;
            overflow: hidden;
        }
        
        .processor-header {
            background: #eee; padding: 8px 15px;
            font-weight: 700; color: #555;
            display: flex; justify-content: space-between;
            align-items: center; font-size: 0.9rem;
        }

        .item-row {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            display: flex; justify-content: space-between;
            align-items: center;
        }
        .item-row:last-child { border-bottom: none; }

        .item-details h4 { font-size: 0.95rem; margin-bottom: 2px; color: #2c3e50; }
        .item-details p { font-size: 0.8rem; color: #7f8c8d; margin: 0; }
        .item-badge {
            display: inline-block; padding: 2px 6px; border-radius: 3px;
            font-size: 0.7rem; margin-right: 5px; background: #eee;
        }

        /* ACTIONS */
        .btn-action {
            padding: 6px 12px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 0.75rem; font-weight: 600;
            margin-left: 5px;
        }
        .btn-check { background: var(--complete-text); color: white; }
        .btn-undo { background: #f39c12; color: white; }
        .btn-del { background: var(--danger); color: white; }

        /* RESPONSIVE MOBILE */
        @media (max-width: 900px) {
            .lists-container {
                grid-template-columns: 1fr; /* Stack columns */
                height: auto; /* Allow auto growth */
            }
            .list-column { margin-bottom: 20px; max-height: 500px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RX Tracking Dashboard</h1>
        <p>Medicine Request & Sales Order Monitoring</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card" style="border-color: #3498db;">
            <span class="stat-val" id="totalCount">0</span>
            <span class="stat-lbl">Total Items</span>
        </div>
        <div class="stat-card" style="border-color: #e67e22;">
            <span class="stat-val" id="pendingCount">0</span>
            <span class="stat-lbl">Pending Requests</span>
        </div>
        <div class="stat-card" style="border-color: #27ae60;">
            <span class="stat-val" id="completeCount">0</span>
            <span class="stat-lbl">Completed</span>
        </div>
    </div>

    <div class="form-section">
        <form id="addForm" class="form-grid">
            <div class="form-group">
                <label>Sales Order (SO) #</label>
                <input type="text" id="soInput" placeholder="SO-001" required>
            </div>
            <div class="form-group">
                <label>Patient Name</label>
                <input type="text" id="patientInput" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <label>Medicine / Item</label>
                <input type="text" id="medInput" placeholder="Item Name" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="qtyInput" placeholder="0" min="1" required>
            </div>
            <div class="form-group">
                <label>Processed By (Staff)</label>
                <input type="text" id="staffInput" placeholder="Staff Name" required>
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <button type="submit" class="btn-add">+ Add Request</button>
            </div>
        </form>
    </div>

    <div class="lists-container">
        
        <div class="list-column">
            <div class="col-header header-pending">
                ⚠ PENDING LIST (To Order/Arrive)
            </div>
            <div class="col-content" id="pendingContainer">
                </div>
        </div>

        <div class="list-column">
            <div class="col-header header-complete">
                ✔ COMPLETED / ARRIVED
                <button onclick="clearAll()" style="float:right; background:none; border:none; color:white; font-size:0.7rem; cursor:pointer; text-decoration:underline; margin-top:3px;">Reset Data</button>
            </div>
            <div class="col-content" id="completeContainer">
                </div>
        </div>

    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let db = JSON.parse(localStorage.getItem('rxTrackerDB')) || [];

    // --- DOM ELEMENTS ---
    const form = document.getElementById('addForm');
    const pendingCont = document.getElementById('pendingContainer');
    const completeCont = document.getElementById('completeContainer');

    // --- INITIAL RENDER ---
    renderAll();

    // --- EVENT LISTENER: ADD ITEM ---
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Capitalize Processor Name automatically for cleaner grouping
        let staffName = document.getElementById('staffInput').value.trim();
        staffName = staffName.charAt(0).toUpperCase() + staffName.slice(1);

        const newItem = {
            id: Date.now(),
            so: document.getElementById('soInput').value.toUpperCase(),
            patient: document.getElementById('patientInput').value,
            med: document.getElementById('medInput').value,
            qty: document.getElementById('qtyInput').value,
            processor: staffName,
            status: 'pending', // 'pending' or 'complete'
            timestamp: new Date().toLocaleString()
        };

        db.push(newItem);
        saveAndRender();
        form.reset();
        document.getElementById('soInput').focus();
    });

    // --- CORE FUNCTIONS ---

    function saveAndRender() {
        localStorage.setItem('rxTrackerDB', JSON.stringify(db));
        renderAll();
    }

    function renderAll() {
        // 1. Update Stats
        document.getElementById('totalCount').innerText = db.length;
        document.getElementById('pendingCount').innerText = db.filter(i => i.status === 'pending').length;
        document.getElementById('completeCount').innerText = db.filter(i => i.status === 'complete').length;

        // 2. Separate Lists
        const pendingList = db.filter(i => i.status === 'pending');
        const completeList = db.filter(i => i.status === 'complete');

        // 3. Render Groups
        renderGroupedList(pendingList, pendingCont, 'pending');
        renderGroupedList(completeList, completeCont, 'complete');
    }

    // Function to group items by "Processed By" and generate HTML
    function renderGroupedList(dataList, container, type) {
        container.innerHTML = ''; // Clear current

        if(dataList.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#ccc;">No ${type} items.</div>`;
            return;
        }

        // Grouping Logic
        const groups = dataList.reduce((acc, item) => {
            (acc[item.processor] = acc[item.processor] || []).push(item);
            return acc;
        }, {});

        // Sort processor names alphabetically
        const sortedProcessors = Object.keys(groups).sort();

        // Loop through each processor group
        sortedProcessors.forEach(processor => {
            const items = groups[processor];
            
            // Create Group Wrapper
            const groupDiv = document.createElement('div');
            groupDiv.className = 'processor-group';

            // Create Group Header
            const count = items.length;
            groupDiv.innerHTML = `
                <div class="processor-header">
                    <span>👤 ${processor}</span>
                    <span style="font-size:0.8em; opacity:0.7;">${count} items</span>
                </div>
            `;

            // Render Items inside this group
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                
                // Content
                const badgeColor = type === 'pending' ? '#fff3cd' : '#d4edda';
                const badgeText = type === 'pending' ? 'WAITING' : 'ARRIVED';
                
                let actionButtons = '';
                if(type === 'pending') {
                    actionButtons = `
                        <button class="btn-action btn-check" onclick="toggleStatus(${item.id})">✔ ARRIVED</button>
                        <button class="btn-action btn-del" onclick="deleteItem(${item.id})">✕</button>
                    `;
                } else {
                    actionButtons = `
                        <button class="btn-action btn-undo" onclick="toggleStatus(${item.id})">↺ UNDO</button>
                    `;
                }

                row.innerHTML = `
                    <div class="item-details">
                        <h4>${item.med} <span style="font-weight:normal; font-size:0.8em;">(x${item.qty})</span></h4>
                        <p>
                            <span class="item-badge">${item.so}</span> 
                            Px: <strong>${item.patient}</strong>
                        </p>
                    </div>
                    <div>
                        ${actionButtons}
                    </div>
                `;
                groupDiv.appendChild(row);
            });

            container.appendChild(groupDiv);
        });
    }

    // --- ACTIONS ---

    window.toggleStatus = function(id) {
        const item = db.find(i => i.id === id);
        if(item) {
            item.status = item.status === 'pending' ? 'complete' : 'pending';
            saveAndRender();
        }
    }

    window.deleteItem = function(id) {
        if(confirm('Are you sure you want to remove this item permanently?')) {
            db = db.filter(i => i.id !== id);
            saveAndRender();
        }
    }

    window.clearAll = function() {
        if(confirm('WARNING: Reset ALL data? This cannot be undone.')) {
            db = [];
            saveAndRender();
        }
    }

</script>

</body>
</html>
